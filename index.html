<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>labo-6</title>
  </head>
  <body>
    <main>
      <select name="sort" id="sort">
        <option value="placeholder" selected hidden disabled>Sortuj po...</option>
        <option value="created_at.asc">Po dacie rosnąco</option>
        <option value="created_at.desc">Po dacie malejąco</option>
        <option value="title.asc">Po nazwie alfabetycznie</option>
      </select>
      <section>
        <div id="articles"></div>
      </section>
      <form id="nowy" method="post">
        <div class="space-y-12">
          <div class="border-b border-gray-900/10 pb-12 dark:border-white/10">
            <h2 class="mt-15 text-base/7 font-semibold text-gray-900 dark:text-white">Dodaj własny artykuł</h2>
            <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
              <div class="sm:col-span-4">
                <label for="title" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Tytuł:</label>
                <div class="mt-2">
                  <div class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-gray-300 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600 dark:bg-white/5 dark:outline-white/10 dark:focus-within:outline-indigo-500">
                    <input id="title" type="text" name="title" class="block min-w-0 grow bg-secondary py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 dark:bg-transparent dark:text-white dark:placeholder:text-gray-500" />
                  </div>
                </div>
              </div>
              <div class="sm:col-span-4">
                <label for="subtitle" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Podtytuł:</label>
                <div class="mt-2">
                  <div class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-gray-300 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600 dark:bg-white/5 dark:outline-white/10 dark:focus-within:outline-indigo-500">
                    <input id="subtitle" type="text" name="subtitle" class="block min-w-0 grow bg-secondary py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 dark:bg-transparent dark:text-white dark:placeholder:text-gray-500" />
                  </div>
                </div>
              </div>
              <div class="sm:col-span-4">
                <label for="author" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Autor:</label>
                <div class="mt-2">
                  <div class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-gray-300 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600 dark:bg-white/5 dark:outline-white/10 dark:focus-within:outline-indigo-500">
                    <input id="author" type="text" name="author" class="block min-w-0 grow bg-secondary py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 dark:bg-transparent dark:text-white dark:placeholder:text-gray-500" />
                  </div>
                </div>
              </div>
              <div class="sm:col-span-4">
                <label for="created_at" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Data utworzenia:</label>
                <div class="mt-2">
                  <div class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-gray-300 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600 dark:bg-white/5 dark:outline-white/10 dark:focus-within:outline-indigo-500">
                    <input id="created_at" type="date" name="created_at" class="block min-w-0 grow bg-secondary py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 dark:bg-transparent dark:text-white dark:placeholder:text-gray-500" />
                  </div>
                </div>
              </div>
              <div class="col-span-full">
                <label for="content" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Zawartość:</label>
                <div class="mt-2">
                <textarea id="content" name="content" rows="3" class="block w-full rounded-md bg-secondary px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500"></textarea>
                </div>
              </div>
            </div>
          </div>
          <button type="submit" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:shadow-none dark:focus-visible:outline-indigo-500">Save</button>
        </div>
      </form>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
